server_name: ingest-1
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

jetstream {
  store_dir: /data/jetstream
  max_mem_store: 512MB
  max_file_store: 30GB
}

authorization {
  user: ingest
  password: $NATS_PASSWORD
  timeout: 2
}

max_payload: 8MB
write_deadline: "10s"
ping_interval: "2m"
ping_max: 3

debug: false
trace: false
logtime: true
