# Asks every external contributor to sign CLA.md on their first pull request (CYRA-915).
# Lives only in the public repository: the export copies publish/overlay/ over the exported tree.
# Signatures go on a dedicated branch, because each release export rewrites main.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: github.repository == 'bussolabs/closeyourit-ingest-community'
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/bussolabs/closeyourit-ingest-community/blob/main/CLA.md
          branch: cla-signatures
          allowlist: alessiobussolari,dependabot[bot]
