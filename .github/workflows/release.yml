# On each stable tag pushed by the private export: the multi-arch image
# ghcr.io/bussolabs/closeyourit-ingest:<version> and :latest, which `closeyourit enable ingest`
# runs, then the GitHub release. GitHub-hosted runners only (CYRA-918).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    if: github.repository == 'bussolabs/closeyourit-ingest-community'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: gateway/go.sum
      - name: Tests before publishing
        working-directory: gateway
        run: |
          go test -race ./...
          go vet ./...
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build metadata
        id: meta
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "number=${TAG#v}"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: gateway
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
            GIT_TAG=${{ github.ref_name }}
            BUILD_TIME=${{ steps.meta.outputs.time }}
          tags: |
            ghcr.io/bussolabs/closeyourit-ingest:${{ steps.meta.outputs.number }}
            ghcr.io/bussolabs/closeyourit-ingest:latest
      - name: Release, now that the image exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG" \
            --notes "Turn it on with: closeyourit enable ingest — https://closeyour.it/docs/ingest-gateway"
